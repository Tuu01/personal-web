    <script>
      // Set the theme before first paint so night visitors never see a flash of day.
      (function () {
        var t = null;
        try { t = localStorage.getItem("tuu-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
